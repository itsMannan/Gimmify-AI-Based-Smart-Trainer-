# Local / CI stack: PostgreSQL, Redis, Prometheus, Grafana, MLflow, API.
# Optional Airflow: docker compose --profile airflow up -d
#
# Usage:
#   cp .env.example .env
#   docker compose up -d

name: demand-forecasting

x-restart: &restart-policy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.4-alpine
    <<: *restart-policy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-demand_forecasting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecast} -d ${POSTGRES_DB:-demand_forecasting}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - forecast-net

  redis:
    image: redis:7.4-alpine
    <<: *restart-policy
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - forecast-net

  prometheus:
    image: prom/prometheus:v2.55.1
    <<: *restart-policy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
    networks:
      - forecast-net

  grafana:
    image: grafana/grafana:11.3.0
    <<: *restart-policy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - forecast-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    <<: *restart-policy
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlartifacts/mlflow.db
      --default-artifact-root /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - forecast-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *restart-policy
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./models/artifacts:/app/models/artifacts
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - forecast-net

  airflow-webserver:
    profiles: ["airflow"]
    image: apache/airflow:2.10.3-python3.11
    <<: *restart-policy
    command: webserver
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-forecast}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-demand_forecasting}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./configs:/opt/airflow/configs:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - forecast-net

  airflow-scheduler:
    profiles: ["airflow"]
    image: apache/airflow:2.10.3-python3.11
    <<: *restart-policy
    command: scheduler
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./configs:/opt/airflow/configs:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forecast-net

  airflow-init:
    profiles: ["airflow"]
    image: apache/airflow:2.10.3-python3.11
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          airflow users create
            --username $$AIRFLOW_WWW_USER_USERNAME
            --password $$AIRFLOW_WWW_USER_PASSWORD
            --firstname Admin
            --lastname User
            --role Admin
            --email ${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}
            || true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forecast-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  mlflow_artifacts:
  airflow_logs:

networks:
  forecast-net:
    driver: bridge
