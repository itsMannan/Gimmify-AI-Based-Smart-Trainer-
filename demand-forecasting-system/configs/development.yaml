app:
  name: demand-forecasting-system
  debug: true
  log_level: DEBUG

api:
  host: 0.0.0.0
  port: 8000
  workers: 1
  reload: true
  cors_origins:
    - http://localhost:3000
    - http://localhost:8000
  rate_limit_per_minute: 120
  cache_ttl_seconds: 60
  request_timeout_seconds: 30

database:
  pool_size: 5
  max_overflow: 10
  echo: true

redis:
  db: 0
  cache_ttl_seconds: 60

mlflow:
  experiment_name: demand-forecasting-dev
  tracking_uri: http://localhost:5000

features:
  lag_days: [1, 7, 14, 28, 56]
  rolling_windows: [7, 14, 28, 56, 84]
  forecast_horizon_days: 14
  encode_categoricals:
    - store_id
    - product_id
    - category
    - region
    - weather_condition
    - seasonality

models:
  default_algorithm: ensemble
  test_size_days: 28
  random_state: 42
  cv_folds: 3

inventory:
  service_level: 0.95
  lead_time_days: 7
  holding_cost_rate: 0.25
  stockout_cost_multiplier: 2.0
