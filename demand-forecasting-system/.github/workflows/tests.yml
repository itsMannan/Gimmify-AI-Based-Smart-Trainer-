name: tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: demand-forecasting-system

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: forecast
          POSTGRES_PASSWORD: test-postgres-password
          POSTGRES_DB: demand_forecasting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecast -d demand_forecasting"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: test-postgres-password
      POSTGRES_DB: demand_forecasting
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      LOG_FORMAT: json
      PROMETHEUS_ENABLED: "false"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: demand-forecasting-system/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src/config.py src/logger.py src/api

      - name: Pytest with coverage
        run: |
          pytest -q \
            --cov=src.config \
            --cov=src.logger \
            --cov=src.api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: demand-forecasting-system/coverage.xml
          if-no-files-found: ignore
