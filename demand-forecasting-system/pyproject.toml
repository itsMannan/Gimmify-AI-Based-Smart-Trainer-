[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecasting-system"
version = "1.0.0"
description = "Production-grade retail demand forecasting: data, models, API, and monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Demand Forecasting Team" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--disable-warnings",
    "--cov=src.config",
    "--cov=src.logger",
    "--cov=src.api",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: hits Dockerized services",
    "e2e: end-to-end system tests",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/**/__init__.py",
    "src/api/routes/forecast.py",
    "src/api/routes/monitor.py",
    "src/api/routes/recommendations.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["dags/", "notebooks/", "scripts/"]
mypy_path = "."

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "mlruns", "mlartifacts", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "E402"]
"scripts/**/*.py" = ["E402"]
"dags/**/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
